name: Release

# Une nouvelle version, quand on le décide : Actions > Release > Run workflow.
# La version vient du dernier tag (v0.1.0, v0.1.1...), Cargo.toml sert seulement pour la première.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version suivante
        type: choice
        options: [patch, minor, major]
        default: patch
      notes:
        description: Points de version séparés par des points-virgules (vide pour reprendre les messages des commits)
        type: string
        required: false
      dry_run:
        description: Essai à blanc (tout sauf la publication, les fichiers restent dans le run)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            patch=${patch%%-*}
            case "${{ inputs.bump }}" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              *) next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "Version $next (précédente ${last:-aucune})"

      - name: Notes
        env:
          NOTES: ${{ inputs.notes }}
          LAST: ${{ steps.version.outputs.last }}
        run: |
          if [ -n "$NOTES" ]; then
            echo "$NOTES" | tr ';' '\n' | sed 's/^ *//; s/ *$//' | grep -v '^$' | sed 's/^/- /' > notes.md
          elif [ -n "$LAST" ]; then
            git log "$LAST..HEAD" --no-merges --pretty='- %s' > notes.md
          else
            git log --no-merges --pretty='- %s' -n 20 > notes.md
          fi
          [ -s notes.md ] || echo "- Corrections" > notes.md
          cat notes.md

      - uses: actions/upload-artifact@v5
        with:
          name: notes
          path: notes.md

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: windows-latest
            binary: target/release/rust-project.exe
            suffix: windows-x64.exe
          - os: ubuntu-22.04
            binary: target/release/rust-project
            suffix: linux-x64
          # Un seul binaire pour les puces Apple et Intel (lipo), et l'app Rust Project.app zippée.
          - os: macos-latest
            binary: target/universal/rust-project
            suffix: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev fonts-dejavu-core xvfb libgl1-mesa-dri libgl1 libegl1 libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 libx11-xcb1

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Mac targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Tous les tests (moteur et interface, sans GPU) : un seul échec, et rien n'est construit ni publié.
      - name: Tests
        run: cargo test --release

      - name: Build
        shell: bash
        env:
          ATELIER_VERSION: ${{ needs.version.outputs.version }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Les deux architectures réunies en un binaire, signé localement (sans compte Apple).
            cargo build --release --target aarch64-apple-darwin
            cargo build --release --target x86_64-apple-darwin
            mkdir -p target/universal
            lipo -create -output target/universal/rust-project target/aarch64-apple-darwin/release/rust-project target/x86_64-apple-darwin/release/rust-project
            codesign --force --sign - target/universal/rust-project
            lipo -info target/universal/rust-project
          else
            cargo build --release
          fi

      # Le binaire démarre vraiment : bibliothèques présentes, serveur MCP, puis la fenêtre.
      - name: Smoke test
        shell: bash
        env:
          ATELIER_DATA: ${{ runner.temp }}/smoke/rust-project.json
        run: |
          set -o pipefail
          bin="${{ matrix.binary }}"
          if [ "$RUNNER_OS" = "Linux" ]; then
            ldd "$bin" | tee ldd.txt
            if grep -q "not found" ldd.txt; then echo "Bibliothèque système manquante"; exit 1; fi
          fi
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' | "$bin" --mcp | tee mcp.txt
          grep -q '"name":"rust-project"' mcp.txt
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Sous un écran virtuel : toujours en vie après 20 s (124 = arrêté par timeout).
            set +e
            xvfb-run -a -s "-screen 0 1600x1000x24" timeout 20 "$bin" --fixture fixtures/demo-en.json
            code=$?
            set -e
            echo "code de sortie $code"
            [ "$code" -eq 124 ]
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            # La fenêtre s'ouvre : toujours en vie après 20 s.
            "$bin" --fixture fixtures/demo-en.json &
            pid=$!
            sleep 20
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid"
              echo "fenêtre toujours ouverte après 20 s"
            else
              set +e
              wait "$pid"
              echo "arrêt prématuré, code de sortie $?"
              exit 1
            fi
          fi

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp "${{ matrix.binary }}" "dist/rust-project-${{ needs.version.outputs.version }}-${{ matrix.suffix }}"

      # Mac : l'app à installer, Rust Project.app zippée (le binaire seul sert aux mises à jour).
      - name: Mac app
        if: runner.os == 'macOS'
        run: |
          v=${{ needs.version.outputs.version }}
          app="Rust Project.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" icon.iconset
          cp "${{ matrix.binary }}" "$app/Contents/MacOS/rust-project"
          for s in 16 32 128 256; do
            sips -z $s $s assets/icon.png --out "icon.iconset/icon_${s}x${s}.png" > /dev/null
            if [ $((s * 2)) -le 256 ]; then
              sips -z $((s * 2)) $((s * 2)) assets/icon.png --out "icon.iconset/icon_${s}x${s}@2x.png" > /dev/null
            fi
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/rust-project.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Rust Project</string>
            <key>CFBundleDisplayName</key><string>Rust Project</string>
            <key>CFBundleIdentifier</key><string>io.github.djdevpro.rustproject</string>
            <key>CFBundleExecutable</key><string>rust-project</string>
            <key>CFBundleIconFile</key><string>rust-project</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$v</string>
            <key>CFBundleVersion</key><string>$v</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.productivity</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "dist/rust-project-$v-macos-universal.zip"
          ls -la dist

      - uses: actions/upload-artifact@v5
        with:
          name: rust-project-${{ matrix.suffix }}
          path: dist/*

  publish:
    needs: [version, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: rust-project-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v5
        with:
          name: notes

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.version.outputs.version }}
          chmod +x dist/*-linux-x64 dist/*-macos-universal
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "v$v" dist/* --repo "${{ github.repository }}" --title "Rust Project $v" --notes-file notes.md --target "${{ github.sha }}"
