name: Release

# Une nouvelle version, quand on le décide : Actions > Release > Run workflow.
# La version vient du dernier tag (v0.1.0, v0.1.1...), Cargo.toml sert seulement pour la première.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version suivante
        type: choice
        options: [patch, minor, major]
        default: patch
      notes:
        description: Points de version séparés par des points-virgules (vide pour reprendre les messages des commits)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            patch=${patch%%-*}
            case "${{ inputs.bump }}" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              *) next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "Version $next (précédente ${last:-aucune})"

      - name: Notes
        env:
          NOTES: ${{ inputs.notes }}
          LAST: ${{ steps.version.outputs.last }}
        run: |
          if [ -n "$NOTES" ]; then
            echo "$NOTES" | tr ';' '\n' | sed 's/^ *//; s/ *$//' | grep -v '^$' | sed 's/^/- /' > notes.md
          elif [ -n "$LAST" ]; then
            git log "$LAST..HEAD" --no-merges --pretty='- %s' > notes.md
          else
            git log --no-merges --pretty='- %s' -n 20 > notes.md
          fi
          [ -s notes.md ] || echo "- Corrections" > notes.md
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: windows-latest
            binary: target/release/atelier.exe
            suffix: windows-x64.exe
          - os: ubuntu-22.04
            binary: target/release/atelier
            suffix: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Les tests du moteur. Les captures d'interface demandent un GPU et tournent en local.
      - name: Tests
        shell: bash
        run: 'cargo test --release -- ::tests:: --skip screens::'

      - name: Build
        env:
          ATELIER_VERSION: ${{ needs.version.outputs.version }}
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp "${{ matrix.binary }}" "dist/atelier-${{ needs.version.outputs.version }}-${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: atelier-${{ matrix.suffix }}
          path: dist/*

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: atelier-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: notes

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.version.outputs.version }}
          chmod +x dist/*-linux-x64
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "v$v" dist/* --repo "${{ github.repository }}" --title "Atelier $v" --notes-file notes.md --target "${{ github.sha }}"
