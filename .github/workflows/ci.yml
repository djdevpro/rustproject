name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      # Les tests du moteur. Les captures d'interface demandent un GPU et tournent en local.
      - name: Tests
        shell: bash
        run: 'cargo test -- ::tests:: --skip screens::'
